[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nostr = { version = "=0.45.5", default-features = false, features = ["std"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"

[dev-dependencies]
secp256k1 = { version = "=0.30.0", default-features = false, features = ["std"] }
