[package]
name = "vault-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vault-core = { path = "../vault-core" }
wasm-bindgen = "=0.2.129"
serde_json = "1"
age = { version = "=0.12.1", default-features = false }
getrandom = { version = "=0.2.17", features = ["js"] }
js-sys = "0.3"
